<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat Agate</title>
  <style>
    .cert-container {
      gap: 20px;
      align-items: flex-start;
    }

    .cert-container img {
      width: 800px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .cert-info {
      flex: 1;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .cert-info h3 {
      margin-top: 0;
      color: #222;
    }
  </style>
</head>
<body bgcolor="bg-blue">
  <section id="certificate">
  <div class="card">
    <center>
    <h2>Sertifikat</h2>
    </center>
    <div class="cert-container">
        <Center>
      <img src="SertifikatArya.PNG.png" alt="Sertifikat Arya">
      </center>
      <div class="cert-info">
        <h3>Webinar Level Up Series</h3>
        <p><strong>Peserta:</strong> Arya Fikri Rinjani</p>
        <p><strong>Penyelenggara:</strong> Agate Academy & Kemendikdasmen</p>
        <p><strong>Tanggal:</strong> 16 Juli 2025 – 26 November 2025</p>
        <p><strong>Deskripsi:</strong> Mengikuti Web & Game Development Bootcamp 2025, mempelajari bahasa pemrograman, hosting, desain website, dan game engine (Unity).</p>
      </div>
    </div>
  </div>
</section>

</body>
</html>
